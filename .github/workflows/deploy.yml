name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gbs-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::Missing one or more DEPLOY_* secrets. Please ensure DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY are set in repository Settings → Secrets → Actions."
            exit 1
          fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/greenbusinesssuite-frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose up --build -d
            echo "Waiting for frontend health..."
            for i in $(seq 1 24); do
              if docker exec gbs_frontend curl -fsS http://localhost:3000 >/dev/null 2>&1; then
                echo "Frontend healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Frontend failed health check"
            docker compose logs --tail=100 frontend
            exit 1
